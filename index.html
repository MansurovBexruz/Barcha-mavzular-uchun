<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>

  <body>
    <div class="max-w-6xl mx-auto">
      <div class="bg-white rounded-lg shadow p-6 mb-4">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">
          Foydalanuvchilar Ma'lumotlari
        </h1>

        <input
          type="text"
          id="search"
          placeholder="Qidiruv..."
          class="w-full max-w-md p-2 border border-gray-300 rounded"
        />
      </div>

      <div
        id="tableContainer"
        class="bg-white rounded-lg shadow overflow-hidden"
      >
        <div id="loading" class="p-8 text-center">
          <div
            class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-4"
          ></div>
          <p>Yuklanmoqda...</p>
        </div>
      </div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-lg p-6 w-full max-w-md">
        <h2 class="text-xl font-bold mb-4">Tahrirlash</h2>

        <div class="space-y-4">
          <input type="hidden" id="editId" />

          <div>
            <label class="block text-sm font-medium mb-1">Ism:</label>
            <input
              type="text"
              id="editName"
              class="w-full p-2 border border-gray-300 rounded"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Email:</label>
            <input
              type="email"
              id="editEmail"
              class="w-full p-2 border border-gray-300 rounded"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Telefon:</label>
            <input
              type="text"
              id="editPhone"
              class="w-full p-2 border border-gray-300 rounded"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Kompaniya:</label>
            <input
              type="text"
              id="editCompany"
              class="w-full p-2 border border-gray-300 rounded"
            />
          </div>
        </div>

        <div class="flex justify-end space-x-2 mt-6">
          <button
            onclick="closeModal()"
            class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
          >
            Bekor qilish
          </button>
          <button
            onclick="saveUser()"
            class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
          >
            Saqlash
          </button>
        </div>
      </div>
    </div>

    <div
      id="deleteModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-lg p-6 w-full max-w-sm">
        <h2 class="text-xl font-bold mb-4">O'chirish</h2>
        <p class="mb-4">Bu foydalanuvchini o'chirishni xohlaysizmi?</p>
        <p id="deleteName" class="font-bold text-red-600 mb-4"></p>

        <div class="flex justify-end space-x-2">
          <button
            onclick="closeDeleteModal()"
            class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
          >
            Bekor qilish
          </button>
          <button
            onclick="confirmDelete()"
            class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600"
          >
            O'chirish
          </button>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="/src/main.ts"></script>
</html>
